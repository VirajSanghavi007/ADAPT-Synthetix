<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ADAPT-Synthetix — Adaptive closed-loop ASR with phoneme diagnostics, drift detection, and LoRA fine-tuning" />
    <meta name="theme-color" content="#0c0f14" />
    <title>ADAPT-Synthetix</title>
    <!--
      Font strategy (rootwebdesign.studio sustainable web fonts guidelines):
      • No external font CDN — system monospace stack renders instantly,
        requires zero download, zero render-blocking requests, zero CO₂.
      • Stack: Cascadia Code (Win 11 Terminal) → JetBrains Mono (JetBrains IDEs)
        → Fira Code → ui-monospace → Menlo (macOS) → Consolas (Windows)
      • font-display: swap is moot here since no @font-face is declared.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #0c0f14; overflow: hidden; }
      #root { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
