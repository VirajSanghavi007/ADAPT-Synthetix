services:
  - type: web
    name: Mercury
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: USE_POSTGRES
        value: "false"
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface
      - key: HF_HOME
        value: /app/.cache/huggingface
    disk:
      name: model-cache
      mountPath: /app/.cache
      sizeGB: 10
    healthCheckPath: /health
