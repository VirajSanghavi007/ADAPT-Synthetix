version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: adapt
      POSTGRES_PASSWORD: adapt
      POSTGRES_DB: mercury
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapt -d mercury"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  Mercury:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - USE_POSTGRES=true
      - DATABASE_URL=postgresql://adapt:adapt@db:5432/mercury
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      - BACKDOOR_KEY=${BACKDOOR_KEY:?BACKDOOR_KEY is required}
    volumes:
      - ./Backend/data:/app/Backend/data
      - ./Backend/logs:/app/Backend/logs
      - ./Backend/models:/app/Backend/models
      - ./Dataset:/app/Dataset
      - hf_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pg_data:
  hf_cache:
